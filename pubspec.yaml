name: smartzo
description: Smartzo - Modern Flutter eCommerce app with WooCommerce backend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # Network
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Image
  cached_network_image: ^3.3.1
  # carousel_slider removed - incompatible with Flutter 3.24
  image_picker: ^1.0.7

  # UI
  google_fonts: ^6.1.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  badges: ^3.1.2
  flutter_rating_bar: ^4.0.1
  readmore: ^3.0.0

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10

  # Payment
  razorpay_flutter: ^1.3.7

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  connectivity_plus: ^5.0.2
  # flutter_local_notifications: ^17.0.0  # Will add later

  # Auth
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
